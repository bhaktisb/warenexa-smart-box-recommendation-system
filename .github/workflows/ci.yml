name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-secret-key-for-github-actions"

    steps:
      # Check out the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up the requested Python version for the job.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ensure pip is current before installing dependencies.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Install the project dependencies from requirements.txt.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run Django's system checks to validate the project configuration.
      - name: Run Django system checks
        run: python manage.py check

      # Apply migrations using the default SQLite database for CI.
      - name: Apply database migrations
        run: python manage.py migrate --noinput

      # Run the full Django test suite and fail the workflow on any failure.
      - name: Run test suite
        run: python manage.py test
