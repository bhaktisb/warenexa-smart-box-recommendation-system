{% extends "base.html" %}

{% block title %}Staff Login | WareNexa Warehouse Suite{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Warehouse Staff Login</h1>
                <p class="text-muted small">Sign in with your staff account to access packing operations.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
